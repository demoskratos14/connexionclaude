name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # APK debug : signé automatiquement avec la clé de debug, donc installable tel quel sur ton téléphone.
      - name: Construire l'APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: "Connexion Claude"
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
